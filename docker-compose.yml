services:
  nsm:
    build:
      context: .
      dockerfile: ${NSM_DOCKERFILE:-Dockerfile}
    ports:
      - "${NSM_PORT:-5000}:5000"
    environment:
      # Container-local TZ (affects only logs/OS clock); the dashboard's
      # displayed times use the athlete's Intervals.icu timezone preference
      # instead, converted via zoneinfo at render time.
      - TZ=${TZ:-Europe/Oslo}
    volumes:
      - ./config.json:/app/config.json:ro
      - nsm-data:/app/data
    restart: unless-stopped

volumes:
  nsm-data:
