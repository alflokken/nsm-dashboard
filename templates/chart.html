{# One SVG chart: pace as a line, work_distance as bars. Coordinates come from stats.chart_geometry. #}
<div class="chart-scroll">
<svg class="stats-chart" viewBox="0 0 {{ chart.width }} {{ chart.height }}" style="min-width: {{ chart.width }}px" role="img" aria-label="{{ title }}">
    <title>{{ title }}</title>
    {% for tick in chart.ticks %}
    <line class="chart-grid" x1="{{ chart.left }}" y1="{{ tick.y }}" x2="{{ chart.right }}" y2="{{ tick.y }}"/>
    <text class="chart-label" x="{{ chart.left - 8 }}" y="{{ tick.y + 4 }}" text-anchor="end">{{ tick.label }}</text>
    {% endfor %}
    {% for label in chart.labels %}
    <text class="chart-label" x="{{ label.x }}" y="{{ chart.bottom + 25 }}" text-anchor="middle">{{ label.label }}</text>
    {% endfor %}
    {% if line %}
        {% for a, b in chart.segments %}
        <line class="chart-line{{ ' chart-faded' if b.faded }}" x1="{{ a.x }}" y1="{{ a.y }}" x2="{{ b.x }}" y2="{{ b.y }}"/>
        {% endfor %}
    {% endif %}
    {% for point in chart.points %}
        {% if line %}
        <circle class="chart-point{{ ' chart-faded' if point.faded }}" cx="{{ point.x }}" cy="{{ point.y }}" r="4"><title>{{ point.label }}: {{ point.text }}{{ unit }}</title></circle>
        {% else %}
        <rect class="chart-bar{{ ' chart-faded' if point.faded }}" x="{{ point.x - chart.bar_width / 2 }}" y="{{ point.y }}" width="{{ chart.bar_width }}" height="{{ chart.bottom - point.y }}" rx="2"><title>{{ point.label }}: {{ point.text }}{{ unit }}</title></rect>
        {% endif %}
    {% endfor %}
</svg>
</div>
