{# [AI-GENERATED] Shared page chrome, theme, and refresh controls. #}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSM - {% block title %}Running Tracker{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127939;</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
    <script>
    (function() {
        var saved = localStorage.getItem('nsm-theme');
        if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    })();
    </script>
</head>
<body class="{{ 'stats-page' if request.endpoint == 'stats_page' else '' }}">
    <div class="app-container">
        <div class="app-header d-flex justify-content-between align-items-center">
            <div class="header-title">
                <span class="app-title">Norwegian Singles Method</span>
                <nav class="page-nav" aria-label="Main navigation">
                    <a href="{{ url_for('index') }}" {% if request.endpoint == 'index' %}aria-current="page"{% endif %}>Training</a>
                    <a href="{{ url_for('stats_page') }}" {% if request.endpoint == 'stats_page' %}aria-current="page"{% endif %}>Stats</a>
                </nav>
            </div>
            <div class="d-flex align-items-center gap-2">
                {% if last_sync %}<span class="sync-meta">Last sync: {{ last_sync }}</span>{% endif %}
                <span id="sync-error" class="sync-error d-none" role="alert" aria-live="polite" title="Sync failed">&#x2716;</span>
                <button id="refresh-btn" class="btn btn-sm btn-outline-secondary" onclick="doRefresh()">
                    <span class="label">Sync</span>
                    <span class="spinner-border d-none" role="status"></span>
                </button>
                <button class="btn btn-sm btn-outline-secondary theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode" title="Toggle dark mode">
                    <span class="theme-icon">&#9789;</span>
                </button>
            </div>
        </div>
        {% block content %}{% endblock %}
    </div>
    <script>
    // [AI-GENERATED] Shared refresh logic keeps partial-sync errors visible after reload.
    function toggleTheme() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (isDark) document.documentElement.removeAttribute('data-theme');
        else document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('nsm-theme', isDark ? 'light' : 'dark');
    }
    function showSyncError(message) {
        const element = document.getElementById('sync-error');
        element.classList.remove('d-none');
        element.title = message;
        element.textContent = 'Sync warning';
    }
    function resetBtn(btn) {
        btn.querySelector('.label').textContent = 'Sync';
        btn.querySelector('.spinner-border').classList.add('d-none');
        btn.disabled = false;
    }
    function doRefresh() {
        const btn = document.getElementById('refresh-btn');
        document.getElementById('sync-error').classList.add('d-none');
        btn.querySelector('.label').textContent = 'Syncing...';
        btn.querySelector('.spinner-border').classList.remove('d-none');
        btn.disabled = true;
        fetch('{{ url_for("refresh") }}', { method: 'POST' })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    if (data.errors && data.errors.length) {
                        sessionStorage.setItem('nsm-sync-warning', data.errors.join('\n'));
                    }
                    window.location.reload();
                } else if (data.busy) {
                    resetBtn(btn);
                    setTimeout(() => window.location.reload(), 5000);
                } else {
                    showSyncError('Sync failed: ' + (data.error || 'Unknown error'));
                    resetBtn(btn);
                }
            })
            .catch(error => {
                showSyncError('Network error: ' + error);
                resetBtn(btn);
            });
    }
    const warning = sessionStorage.getItem('nsm-sync-warning');
    if (warning) {
        showSyncError(warning);
        sessionStorage.removeItem('nsm-sync-warning');
    }
    {% if stale and not syncing %}doRefresh();{% endif %}
    {% if syncing %}setTimeout(() => window.location.reload(), 5000);{% endif %}
    setInterval(() => {
        if (document.hidden || document.getElementById('refresh-btn').disabled) return;
        window.location.reload();
    }, {{ stale_minutes }} * 60 * 1000);
    </script>
</body>
</html>
