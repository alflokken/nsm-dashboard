<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSM - {% block title %}Running Tracker{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏃</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
    <script>
    // Theme: apply early to prevent FOUC
    (function() {
        var saved = localStorage.getItem('nsm-theme');
        if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    })();
    </script>
</head>
<body>
    <!-- Header -->
    <div class="app-container">
    <div class="app-header d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-3">
            <span class="app-title">Norwegian Singles Method</span>
            <nav class="page-nav">
                <a href="{{ url_for('index') }}"{% if request.endpoint == 'index' %} aria-current="page"{% endif %}>Training</a>
                <a href="{{ url_for('stats_page') }}"{% if request.endpoint == 'stats_page' %} aria-current="page"{% endif %}>Stats</a>
            </nav>
        </div>
        <div class="d-flex align-items-center gap-2">
            {% if last_sync %}
            <span class="sync-meta">Last sync: {{ last_sync }}</span>
            {% endif %}
            <span id="sync-error" class="sync-error d-none" role="alert" aria-live="polite" title="Sync failed">&#x2716;</span>
            <button id="refresh-btn" class="btn btn-sm btn-outline-secondary" onclick="doRefresh()">
                <span class="label">Sync</span>
                <span class="spinner-border d-none" role="status"></span>
            </button>
            <button class="btn btn-sm btn-outline-secondary theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode" title="Toggle dark mode">
                <span class="theme-icon">&#9789;</span>
            </button>
        </div>
    </div>

    {% block content %}{% endblock %}

    </div><!-- /app-container -->

    <script>
    function toggleTheme() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (isDark) {
            document.documentElement.removeAttribute('data-theme');
            localStorage.setItem('nsm-theme', 'light');
        } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('nsm-theme', 'dark');
        }
    }

    // Sync
    function doRefresh() {
        const btn = document.getElementById('refresh-btn');
        const errEl = document.getElementById('sync-error');
        if (errEl) errEl.classList.add('d-none');
        if (btn) {
            btn.querySelector('.label').textContent = 'Syncing…';
            btn.querySelector('.spinner-border').classList.remove('d-none');
            btn.disabled = true;
        }

        fetch('/api/refresh', { method: 'POST' })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    window.location.reload();
                } else if (data.busy) {
                    // Another sync is already running; just reset, no error.
                    resetBtn(btn);
                } else if (errEl) {
                    errEl.classList.remove('d-none');
                    errEl.title = 'Sync failed: ' + (data.error || 'Unknown error');
                    resetBtn(btn);
                }
            })
            .catch(err => {
                if (errEl) {
                    errEl.classList.remove('d-none');
                    errEl.title = 'Network error: ' + err;
                }
                resetBtn(btn);
            });
    }

    function resetBtn(btn) {
        if (!btn) return;
        btn.querySelector('.label').textContent = 'Sync';
        btn.querySelector('.spinner-border').classList.add('d-none');
        btn.disabled = false;
    }

    // Stale-while-revalidate: auto-refresh in the background if data is old.
    {% if stale %}
    doRefresh();
    {% endif %}

    // Keep a long-open tab fresh: periodically re-check (server decides if a sync is needed).
    setInterval(() => {
        if (document.hidden) return;
        const btn = document.getElementById('refresh-btn');
        if (btn && btn.disabled) return;  // sync already in progress
        window.location.reload();
    }, {{ stale_minutes }} * 60 * 1000);
    </script>
</body>
</html>
